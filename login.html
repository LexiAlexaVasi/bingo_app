<!--PAGINA LOGIN-->

<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>

<video class="bg-video" autoplay muted loop playsinline>
    <source src="videos/background.mp4" type="video/mp4">
</video>

<nav class="top-nav">
    <a href="index.html" class="nav-item">ACASĂ</a>
    <a href="reguli.html" class="nav-item">REGULI</a>
    <a href="liste.html" class="nav-item">BINGO</a>
</nav>

<div>
    <div class="avatar"></div>

    <h2 class="login-title">Sign In</h2>

    <input type="text" id="username" placeholder="User">
    <input type="password" id="password" placeholder="Password">

    <button class="btn primary" onclick="login()">Sign in</button>

    <p id="error" style="color:#ff6b6b; margin-top:10px;"></p>
</div>

<script>
async function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const error = document.getElementById("error");

    error.textContent = "";

    try {
        const res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: user,
                password: pass
            })
        });

        const data = await res.json();

        if (!res.ok) {
            error.textContent = data.message || "Eroare la autentificare";
            return;
        }

        // login reușit
        localStorage.setItem("loggedUser", data.username);
        window.location.href = "liste.html";

    } catch (err) {
        error.textContent = "Serverul nu răspunde!";
    }
}
</script>

</body>
</html>
